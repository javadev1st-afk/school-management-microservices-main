spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: ${JPA_FORMAT_SQL:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/school_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  base-url: ${APP_BASE_URL:http://localhost:8000/ui}
  jwt-secret-key: ${JWT_SECRET_KEY:change-me-in-each-environment}
  corsallowed: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8000}
  open-endpoints:
    - /ui/**
    - /api/v1/auth/**
    - /api/auth/**
    - /api/public/**
    - /internal/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /swagger-ui/index.html
    - /webjars/**
    - /swagger-resources/**
    - /configuration/**
    - /error
    - /favicon.ico
    - /static/ui/**
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}